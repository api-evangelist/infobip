asyncapi: 3.0.0
info:
  title: Infobip platform webhooks
  version: 3.210.0
  description: AsyncAPI projection of the 102 webhooks published in the Infobip platform OpenAPI 3.1 document (the "webhooks"
    object). Each channel is an Infobip-originated HTTP callback delivered to a customer-configured URL — delivery reports,
    inbound messages, conversation/calls events, tracking notifications and platform events. Derived by API Evangelist from
    the provider spec; message payloads $ref the schemas in that same document.
  contact:
    name: Infobip support
    email: support@infobip.com
    url: https://www.infobip.com/contact
  externalDocs:
    url: https://www.infobip.com/docs/api
defaultContentType: application/json

    - id: 66
      name: UNDELIVERABLE_NO_DESTINATION
      description: 'The status occurs when a TO object in a Push API call defines a filter that does not resolve
        any pushRegistrationIds as destinations for Push delivery. The to field is used to query the message recipient
        segment. For example, you can target a tag that does not exist in any instance of the requested ApplicationCode.
        In this case, no destinations are found. Alternatively, you can target all application instances (devices)
        that use Android OS. Here CloudType: GCM resolves all destinations and sends'
  - group: Rejected
    group_id: 5
    kind: status
    code_count: 7
    codes:
    - id: 65
      name: REJECTED_NO_APPLICATION
      description: The status occurs when an invalid or non-existent ApplicationCode is used in the from field of
        a Push API call. Each application profile has a unique ApplicationCode, which is used in the SDK as a key
        identifier for the application installed on an end user's device and enables communication with the platform.
        For each paired device and installed application, a pushRegistrationId is issued and uniquely linked to
        the ApplicationCode. You can get all available applications or check the configuratio
    - id: 68
      name: REJECTED_PAYLOAD_TOO_BIG
      description: The total serialized message payload in a Push API request exceeds the maximum allowed size of
        4000 characters. The payload size is calculated across all message fields combined, including the message
        text, custom payload data, notification options, and any other content included in the request. To resolve
        this, reduce the overall content of the message to ensure the combined serialized size does not exceed 4000
        characters.
    - id: 69
      name: REJECTED_NO_CONTENT
      description: The Push API request contains neither a text field nor a localization textKey. Every push notification
        must have some form of message content — either a plain text string in the text field, or a localization
        key in textKey that maps to a localized string defined in the application. To resolve this, include either
        a text value with the message content or a textKey if your application uses localized strings.
    - id: 70
      name: REJECTED_INVALID_VALIDITY_PERIOD
      description: The validityPeriod specified in a Push API request is shorter than the minimum allowed duration
        of 30 seconds. The validity period defines how long the platform will attempt to deliver the message before
        it expires and delivery is abandoned. To resolve this, set the validityPeriod to a value of 30 seconds or
        longer.
    - id: 71
      name: REJECTED_INVALID_QUERY
      description: The destination query in the to field of a Push API request cannot be parsed or is structurally
        invalid. The to field defines the recipient segment for message delivery and must follow the supported query
        format. Common causes include unsupported field names, invalid operators, or a malformed query object. To
        resolve this, review the to field in your request and ensure the query is correctly structured. For more
        information about targeting recipients, refer to the Push API documentation.
    - id: 73
      name: REJECTED_INVALID_INBOX_TOPIC
      description: The inboxTopic specified in a Push API request does not exist for the account. Inbox topics are
        used to route push notifications into a persistent in-app inbox on the user's device, and must be created
        and configured for your account before they can be referenced in a send request. To resolve this, verify
        that the inbox topic exists for your account in the Infobip web interface, or omit the inboxTopic field
        if inbox message storage is not required for this notification.
    - id: 74
      name: REJECTED_INVALID_PRIMARY_BUTTON_ACTION
      description: The primaryButtonAction object in a Push API request is configured inconsistently. The primaryButtonAction
        defines the action triggered when the user taps the primary button on an interactive push notification.
        It requires both a type (the kind of action to perform) and a resource (the target of that action, such
        as a URL or deeplink). Providing one without the other is not valid. To resolve this, ensure that the primaryButtonAction
        object includes both a type and a resource, or remove the objec

        Attribute value <strong>MUST NOT</strong> be <strong>null</strong> as in that case it will be ignored.<br/>

        In some cases where attribute value has no parameters it <strong>NEEDS TO BE</strong> an empty object.'
      example:
        simSwap:
          period: 24
        nationalIdentityNumber:
          nationalId: 123.456.789-10
      properties:
        simSwap:
          $ref: '#/components/schemas/c4fb96364cd87b1d1d15720880c5153ef26f58342e4ec03b9d5896f2251f17ae.SimSwapRequestDto'
        nationalIdentityNumber:
          $ref: '#/components/schemas/c4fb96364cd87b1d1d15720880c5153ef26f58342e4ec03b9d5896f2251f17ae.NationalIdentityNumberDto'
        deviceLocation:

aid: infobip
url: https://raw.githubusercontent.com/api-evangelist/infobip/refs/heads/main/apis.yml
name: Infobip
kind: company
description: 'Infobip is a global communications platform as a service (CPaaS) provider headquartered in Vodnjan,
  Croatia, and is Croatia''s largest technology company. It sells programmable messaging, voice, video, email and
  customer engagement APIs on top of direct connections into mobile network operators worldwide, sitting in the
  aggregator layer of the telecom value chain: it buys and resells carrier connectivity, and it is the developer-facing
  surface that most businesses actually integrate with rather than the carriers themselves. Its API posture is openly
  self-serve — a free-trial account, a documentation hub at infobip.com/docs/api, first-party SDKs in six languages,
  a public Postman workspace, remote MCP servers, and an unauthenticated OpenAPI 3.1 endpoint at https://api.infobip.com/platform/1/openapi
  that returns the complete specification for all public endpoints and webhooks, plus per-product specifications
  for 46 products. On the network-API side Infobip is a GSMA Open Gateway participant certified for SIM Swap and
  Number Verification (September 2025) and an Aduna channel partner, and it publishes callable CAMARA endpoints
  — Number Verification, SIM Swap, Device Location Verification and KYC Match — though CAMARA access itself is sales-gated
  behind a contact form even while the specification is public.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg

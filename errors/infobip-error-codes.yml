    - id: 51
      name: MISSING_TO
      description: The request has been received, but the to parameter has not been set, or it is empty, that is,
        there must be a valid recipient to send the message to.
    - id: 52
      name: REJECTED_DESTINATION
      description: The request has been received, but the destination is invalid—the number prefix is incorrect
        as it does not match a valid number prefix by any mobile operator. Number length is also taken into consideration
        when verifying number validity.
    - id: 87
      name: SIGNALS_BLOCKED
      description: Message has been rejected due to an anti-fraud mechanism. If the message is deemed fraudulent,
        it will not be charged.
    - id: 99
      name: REJECTED
      description: The call was rejected/declined by the end user at the receiving end.
    - id: 100
      name: UNDELIVERABLE_REJECTED_PLATFORM
      description: The request was rejected due to being invalid, malformed, or because the service is temporarily

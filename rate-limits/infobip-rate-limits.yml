name: Infobip API rate limits
source: openapi/_original/infobip-platform-full-openapi.json
docs: https://www.infobip.com/docs/essentials/api-essentials/integration-best-practices#throttling-handling-errors
summary: 'Infobip publishes no account-wide numeric rate limit in prose: the API reference states message-sending APIs have no upper limit and non-sending APIs are throttled with HTTP 429 when usage exceeds expected levels. The per-operation limits below are declared by the provider inside the OpenAPI document (x-throttling-info on 676 of 968 operations, spec version 3.245.1); the two mechanisms (time-based window, token bucket) and the Retry-After header are documented on the integration best-practices page.'
documented_statements:
- text: Our message sending APIs have no upper limit, and we can handle traffic peaks from the world's largest enterprises.
  source: https://www.infobip.com/docs/api#rate-limits
- text: For non-message sending APIs, requests are throttled if usage exceeds expected levels. If this happens, you'll receive an HTTP status code 429 - Too Many Requests.
  source: https://www.infobip.com/docs/api#rate-limits
- text: Infobip API uses token-based rate limiting to control request rates. Different endpoints may have different throttling configurations, and you should consult the specific API documentation for each endpoint to understand the applicable limits.
  source: https://www.infobip.com/docs/essentials/api-essentials/integration-best-practices#throttling-handling-errors
- text: 'Time-based rate limit: Limits the number of requests within a fixed time window. Example: 100 requests per 10 seconds'
  source: https://www.infobip.com/docs/essentials/api-essentials/integration-best-practices#rate-limit-types
- text: 'Token-based rate limit: Uses a token bucket algorithm that allows bursts while maintaining a steady refill rate. Example: Burst capacity of 5 requests with a refill rate of 1 request per second'
  source: https://www.infobip.com/docs/essentials/api-essentials/integration-best-practices#rate-limit-types
- text: Check the Retry-After header in the 429 response, if present, to know when to retry
  source: https://www.infobip.com/docs/essentials/api-essentials/integration-best-practices#handling-throttled-requests
headers:
  Retry-After: documented on 429 responses ("if present"); no X-RateLimit-* or RateLimit-* headers are documented
  status_on_exhaustion: 429
  error_code: TOO_MANY_REQUESTS
retry_guidance: exponential backoff with increasing wait per throttled response; monitor the overall number of throttled requests (integration best practices)
mechanisms:
- time-window
- token-bucket
limit_count: 37
operations_with_declared_limits: 676
operations_total: 968

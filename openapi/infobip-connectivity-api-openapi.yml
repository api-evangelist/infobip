                      networkName: Verizon Wireless
                      networkId: 1717
                      generatedDate: '2024-03-19T00:00:00Z'
                      dateFrom: '2024-03-19T00:00:00Z'
                      dateTo: '2024-03-20T00:00:00Z'
                      expiryDate: '2024-05-18T00:00:00Z'
                    - reportId: 534a3153-0b3d-4408-9bc5-121d3e9c6537

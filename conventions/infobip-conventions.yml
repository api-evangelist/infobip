reversibility:
  coverage: partial
  grade: documented
  summary: 'Reversal exists only for not-yet-executed work: scheduled SMS, email and voice/TTS bulks can be paused, cancelled or rescheduled before they are sent, scheduled call bulks can be cancelled while unfinished, live calls can be hung up, and purchased numbers, resource requests and event exports can be cancelled. A delivered message, a completed call or a consumed PIN cannot be taken back, and the docs state no reversal window for any of these in days or hours.'
  surfaces:
  - write: send-sms-messages (POST /sms/3/messages with sendAt)
    reversal: update-scheduled-sms-messages-status
    method: PUT /sms/1/bulks/status
    window: while the bulk is still scheduled (not stated as a duration)
    reschedule: reschedule-sms-messages
    docs: https://www.infobip.com/docs/api/channels/sms
    evidence: 'spec description: "Change the status or completely cancel sending of scheduled messages."'
  - write: send-email (scheduled bulks)
    reversal: update-scheduled-email-statuses
    method: PUT /email/1/bulks/status
    window: while scheduled; the spec says to set the bulk to PAUSED before rescheduling and PENDING to resume
    reschedule: reschedule-emails
    docs: https://www.infobip.com/docs/api/channels/email
    evidence: 'spec description: "Change status or completely cancel sending of scheduled messages."'
  - write: TTS / voice bulks
    reversal: manage-sent-bulks-status
    method: PUT /tts/3/bulks/status
    window: while scheduled (sendAt or sending-speed bulks can be paused, resumed or canceled)
    reschedule: reschedule-sent-bulk
    docs: https://www.infobip.com/docs/api/channels/voice
  - write: create call bulk (calls)
    reversal: cancel-bulk
    method: POST /calls/1/bulks/{bulkId}/cancel
    window: '"Bulk can be cancelled if it was created with scheduling options and has not finished yet."'
    reschedule: reschedule-bulk
    docs: https://www.infobip.com/docs/api/channels/voice
  - write: create call / conference / dialog
    reversal: hangup-call, hangup-conference, hangup-dialog
    method: POST /calls/1/{calls|conferences|dialogs}/{id}/hangup
    window: while the call is active
    docs: https://www.infobip.com/docs/api/channels/voice
  - write: purchase number
    reversal: cancel-number
    method: DELETE /numbers/1/numbers/{numberKey}
    window: not stated; the number returns to the public pool on cancellation
    docs: https://www.infobip.com/docs/api/platform/numbers
  - write: create resource (sender) request
    reversal: cancel-resource-request
    method: POST /resources/1/requests/{id}/cancel
    window: not stated
    docs: https://www.infobip.com/docs/api/platform/resources
  - write: create events export
    reversal: cancel-events-export-request
    method: DELETE /peopleevents/1/export/{requestId}
    window: not stated (asynchronous cancellation)
    docs: https://www.infobip.com/docs/api/customer-engagement/people
  irreversible:
  - a message once sent to the carrier/channel (no recall operation)
  - a completed voice call
  - a verified 2FA PIN
  - a sent WhatsApp/RCS/Viber message

notes: 'Infobip separates HTTP-level errors (errors/infobip-problem-types.yml) from message-level STATUS and ERROR
  registries. Both are returned as objects on send responses, delivery reports, logs and webhooks: status {groupId,
  groupName, id, name, description} and error {groupId, groupName, id, name, description, permanent}. Status groups:
  0 OK, 1 PENDING, 2 UNDELIVERABLE, 3 DELIVERED, 4 EXPIRED, 5 REJECTED. Error groups: 0 OK, 1 handset/registration/client/dropped,
  2 user/provider/bounced, 3 operator/cloud/system. The permanent flag tells a caller whether a retry can ever succeed.'

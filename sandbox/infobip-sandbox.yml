free_trial:
  signup: https://www.infobip.com/signup
  products:
  - the channels selected at signup
  - People
  - Broadcast
  message_allowance: up to 100 messages per channel to a verified number (varies by channel)
  verified_recipients: messages can only be delivered to the phone number and email addresses verified at signup;
    phone verification is limited to 1 number on a free trial (further recipients can be added and verified, up
    to five)
  sender: a predefined shared Infobip test sender must be used; it is removed once the free message limit for that
    channel is reached

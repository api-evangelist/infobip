method: searched
status: published
source: https://www.infobip.com/docs/mcp, https://github.com/infobip/mcp, live probes of https://mcp.infobip.com
summary: 'Infobip runs a FLEET of remote MCP servers rather than a single endpoint: one server

  per API product, all on https://mcp.infobip.com/{product}. Streamable HTTP is the

  default transport, SSE is available by appending /sse, and STDIO clients connect

  through the mcp-remote bridge. The two documentation servers (search, deep-research)

  are anonymous; every product server is OAuth 2.1 / API-key protected and publishes

  RFC 9728 protected-resource metadata at

  https://mcp.infobip.com/.well-known/oauth-protected-resource/{product}

  naming https://auth.infobip.com/realms/infobip as the authorization server.

  '
transport:
  default: streamable-http
  alternatives:
  - sse
  - stdio-via-mcp-remote
  sse_convention: append /sse to the server URL
authentication:
  methods:
  - type: oauth2.1
    authorization_server: https://auth.infobip.com/realms/infobip
    discovery: https://mcp.infobip.com/{product}/.well-known/oauth-authorization-server
    protected_resource_metadata: https://mcp.infobip.com/.well-known/oauth-protected-resource/{product}
  - type: apiKey
    header: Authorization
    format: App {INFOBIP_API_KEY}
  anonymous_servers:
  - search
  - deep-research
servers:

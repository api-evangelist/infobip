- family: Chat error codes
  groups:
  - group: Client errors
    group_id: 1
    kind: error
    code_count: 36
    codes:
    - id: 7001
      name: EC_UNKNOWN_APPLICATION
      permanent: true
      description: Indicates that the requested application is unknown or not recognized. Resolution steps involve
        verifying the application details, ensuring proper configuration, and contacting the appropriate support
        channels for assistance.
    - id: 7002
      name: EC_UNKNOWN_USER
      permanent: true
      description: 'Signifies that the user is unknown or not registered. In the context of RCS, this means the
        user cannot be reached through RCS because: • Their device does not support RCS or RCS is disabled. • Their
        mobile network does not support RCS for the agent (either the agent is not launched there or RCS traffic
        is not enabled). • An unlaunched agent is requesting capabilities for a user who is not a registered tester.
        To resolve this error, verify the user''s details or ensure that the MSISDN is correct '
    - id: 7003
      name: EC_BLOCKED_USER
      permanent: true
      description: Indicates that the user has been blocked or restricted from accessing the messages. In RCS, this
        occurs when the user has opted out of further communication from the agent. Resolution steps involve investigating
        the reason for the user block, reviewing any violation or restriction policies, and taking appropriate actions
        such as unblocking or contacting Support for further assistance.
    - id: 7004
      name: EC_UNAUTHORIZED_ACCESS
      permanent: true
      description: Denotes unauthorized access or unrecognized service access credentials. To resolve this error,
        investigate the unauthorized access attempt, ensure proper authentication/credentials, and contact Support
        for further assistance.
    - id: 7005
      name: EC_FORBIDDEN_ACCESS
      permanent: true
      description: 'Indicates that access to the requested resource or service is forbidden. In RCS, this may occur
        when: • An unlaunched agent attempts to send a message, event, or capability callback to a non-tester. •
        The carrier does not support RCS or the carrier itself is not supported. Resolution steps involve verifying
        the user''s access rights and permissions, ensuring the application is allowed to send messages, and verifying
        that it is published or approved by the provider.'
    - id: 7006
      name: EC_BAD_REQUEST
      permanent: true
      description: 'The server cannot process the request due to invalid syntax or parameters. In RCS, this typically
        occurs when: • The message contains unsupported content. • The message includes features or settings that
        the recipient’s device does not support. Verify the request data and ensure that it follows the required
        format or check the API documentation for the correct request structure or contact Support for additional
        guidance.'
    - id: 7007
      name: EC_ILLEGAL_TRAFFIC_TYPE
      permanent: true
      description: Indicates that the content of the submitted message does not align with the registered traffic
        type of the sender. This could be due to the use of incompatible media elements or not understanding any
        restrictions or guidelines related to traffic types. For more specific details and assistance, contact Support.
    - id: 7008
      name: EC_INVALID_TEMPLATE_ARGS
      permanent: true
      description: Denotes invalid or missing parameters in a message template. To resolve this error, review the
        template structure, ensure that all required parameters are provided, and correct any invalid or missing
        parameters.
    - id: 7009
      name: EC_INVALID_TEMPLATE
      permanent: true
      description: Signifies an invalid or incorrect message template. In RCS, it's used on connections that have
        template management. Resolution steps involve reviewing the template and making the necessary modifications
        or corrections.
    - id: 7010
      name: EC_NO_SESSION
      permanent: true
      description: Indicates that the session has not been initiated or has expired. To resolve this error, establish
        a valid session by authenticating the user or application, ensuring a new session, or extending the existing
        session.
    - id: 7011
      name: EC_ACCOUNT_ISSUE
      permanent: true
      description: Signifies an issue or problem related to the user's account. Resolution steps involve investigating
        the account-related problem and contacting Support for further assistance.
    - id: 7012
      name: EC_DEPLOYMENT_CONFIGURATION_ERROR
      permanent: false
      description: Denotes an error or issue with the deployment or configuration of the system or service. To resolve
        this error, contact Support for further assistance.
    - id: 7013
      name: EC_MEDIA_HOSTING_ERROR
      permanent: false
      description: Indicates an error or problem related to media hosting or storage. Resolution steps involve verifying
        the media hosting setup, ensuring proper connectivity, and resolving any hosting-related issues.
    - id: 7014
      name: EC_MEDIA_UPLOAD_ERROR
      permanent: false
      description: Signifies an error or problem encountered during media upload. To resolve this error, check for
        any network or connectivity issues, and ensure that the media file meets the specified requirements.
    - id: 7015
      name: EC_MEDIA_METADATA_ERROR
      permanent: true
      description: Denotes an error or issue with the metadata associated with media files. Resolution steps involve
        reviewing the metadata information, ensuring content type and size, and resolving any metadata-related problems.
    - id: 7016
      name: EC_SPAM_RATE
      permanent: true
      description: Message failed because there are restrictions related to the sender quality rating on how many
        messages can be sent from this sender to unique end users during the period defined by the provider.
    - id: 7017
      name: EC_TOO_MANY_REQUESTS
      permanent: false
      description: Signifies that the number of requests from the application has exceeded the allowed limit. In
        RCS, this occurs when tester request quotas are exceeded, such as sending more than 20 tester requests in
        a single day or surpassing the total maximum of 200 tester requests. To resolve this error, reduce the frequency
        or number of requests, adhere to rate limits, and consider optimizing the request flow if necessary.
    - id: 7018
      name: EC_INTERNAL_BAD_MAPPING
      permanent: true
      description: Denotes an internal error related to mapping or data structures within the system. In RCS, this
        occurs when a message is rejected due to an invalid request, such as using a disallowed image format or
        incorrectly applying message parameters. Resolution steps involve investigating the mapping issue, reviewing
        and resolving any inconsistencies or errors in the mapping process, and contacting Support for further assistance.
    - id: 7019
      name: EC_PROVIDER_BILLING_ERROR
      permanent: true
      description: Indicates an error or problem with the billing process or integration with the provider. To resolve
        this error, review the billing setup, ensure proper integration and configuration with the provider, and
        address any billing-related issues or errors.
    - id: 7020
      name: EC_DEVICE_REPRODUCTION_ERROR
      permanent: true
      description: Signifies an error or problem related to displaying content on the end user device. To resolve
        it, check network connectivity and refresh the content, clear the cache, update the app or software, ensure
        device compatibility, and verify if the latest Terms of Service has been accepted. If the issue persists,
        contact Support for further assistance.
    - id: 7021
      name: EC_LIMITED_FUNCTIONALITY
      permanent: true
      description: Denotes limited functionality or restricted access to certain features or services on the Meta
        side. To resolve this error, review the functionality restriction on the Meta side.
    - id: 7022
      name: EC_MEDIA_UNSUPPORTED
      permanent: true
      description: Indicates that the media file or format is not supported by Meta. Resolution steps involve verifying
        the supported media formats, converting the media file to a supported format if necessary, and ensuring
        compatibility with Meta's media requirements.
    - id: 7023
      name: EC_DATA_MISMATCH
      permanent: true
      description: Signifies a mismatch or inconsistency in the data, either locally or remotely. To resolve this
        error, validate its accuracy and consistency, and address any mismatches or inconsistencies. If you need
        additional assistance, contact Support.
    - id: 7024
      name: EC_NOT_ALLOWED_SENDING_TIME
      permanent: false
      description: Denotes an error where the sending time for the message is not allowed or falls outside the permitted
        time window. Resolution steps involve reviewing the sending time restrictions or policies, adjusting the
        sending time if necessary, and ensuring compliance with the permitted time frames.
    - id: 7025
      name: EC_UNSUPPORTED_MOBILE_APP_VERSION
      permanent: true
      description: Indicates that the mobile app version being used is not supported by Meta. To resolve this error,
        update the mobile app to a supported version, ensure compatibility with Meta requirements, and address any
        version-related issues. Contact Support for further assistance.
    - id: 7026
      name: EC_MESSAGE_TYPE_EXHAUSTED
      permanent: true
      description: Denotes that the message type or category has been exhausted or reached the supplier's API limit.
        Resolution steps involve reviewing the message type limitations and managing message usage within the allocated
        limits.
    - id: 7027
      name: EC_BLOCKED_CONTENT
      permanent: true
      description: Signifies that the content of the message is blocked or restricted due to policy violations or
        content filtering. To resolve this error, review the message content, ensure compliance with content guidelines,
        modify the content if necessary, and address any policy violations.
    - id: 7029
      name: EC_USER_IDENTITY_CHANGED
      permanent: true
      description: Indicates that the user's identity or authentication details have changed or become invalid.
        Resolution steps involve verifying the user's identity, updating authentication information if necessary,
        and ensuring proper user identification and authentication.
    - id: 7030
      name: EC_TEMPLATE_BLOCKED_BY_USER
      permanent: true
      description: The receiving user has blocked a specific template.
    - id: 7031
      name: EC_INVALID_WA_FLOW
      permanent: true
      description: Indicates an invalid state of the flow or an incorrect mode in the Flow message. Resolution steps
        involve verifying the message request and flow. Applies to cases where the flow is in a deprecated, blocked,
        or throttled state, as well as cases of an invalid flow mode in message requests (for example, using a draft
        when the flow is published).
    - id: 7032
      name: EC_FREQUENCY_CAPPING
      permanent: true
      description: Indicates that the message was rejected because Meta limits how many WhatsApp marketing template
        messages a person can receive from all businesses within a certain time period. Once a user reaches this
        per-user limit, additional marketing templates that would start a new conversation may be blocked, starting
        with messages that are less likely to be read. For more details, refer to the Meta documentation.
    - id: 7033
      name: EC_MARKETING_OPT_OUT
      permanent: true
      description: Indicates that the message was not delivered because the recipient has opted out of receiving
        WhatsApp marketing messages from this business. This occurs when the end user disables the Offers and announcements
        setting in WhatsApp. To resume receiving marketing messages, the user must manually re-enable this option
        in WhatsApp. For more information, refer to the Meta documentation.
    - id: 7034
      name: EC_SENDER_NOT_REGISTERED
      permanent: true
      description: Sender not registered on the WhatsApp Business Platform.
    - id: 7035
      name: EC_CALL_PERMISSION_REQUEST_FAILED
      permanent: false
      description: The maximum number of call permission requests has been reached for this business–consumer pair.
    - id: 7102
      name: EC_PHONE_MATCHING_DISABLED
      permanent: true
      description: Indicates a data mismatch or inconsistency, either locally or remotely. To resolve the issue,
        verify the accuracy and consistency of the data, and address any discrepancies or inconsistencies. Contact
        Support for additional assistance.
    - id: 7201
      name: EC_UNSUPPORTED_DEVICE
      permanent: true
      description: Denotes an unsupported or incompatible device attempting to access the service. To resolve this
        error, verify the device compatibility requirements, and address any device-related issues or limitations.

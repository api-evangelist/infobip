source: mcp/infobip-mcp.yml (searched) bound to operationIds verified in openapi/*.json
summary: |
  Infobip exposes one MCP server per API product, so the crosswalk is a SERVER-to-SPEC
  binding rather than a tool-to-operation binding: the product servers' tools/list is
  auth-gated (HTTP 401), so the individual tool names and input schemas are not publicly
  observable. What IS public is (a) the per-server capability list Infobip publishes in
  github.com/infobip/mcp, (b) the OAuth scope each server requires (RFC 9728
  protected-resource metadata), and (c) the OpenAPI operations that back each product.
  Every operationId below was grepped out of the spec named in `openapi:` - none are
  invented. Confidence is set to `medium` wherever the binding is by published capability
  name rather than by an observed tool schema.
surfaces:
  openapi:
    catalog: openapi/ (47 documents, 1,886 operations)
    full_spec: openapi/infobip-platform-full-openapi.json
    live_endpoint: https://api.infobip.com/platform/1/openapi
    gated: false
  mcp:
    base: https://mcp.infobip.com
    manifest: mcp/infobip-mcp.yml
    gated: true
    note: |
      tools/list returns 200 only for the two anonymous documentation servers
      (search, deep-research); all 15 product servers return HTTP 401 MCP401.
  graphql:
    present: false
    note: Infobip publishes no public GraphQL surface.

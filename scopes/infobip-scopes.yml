source: https://www.infobip.com/docs/essentials/api-essentials/api-authorization
docs: https://www.infobip.com/docs/essentials/api-essentials/api-authorization
notes: Infobip applies one scope model across ALL authentication types (API key, Basic, IBSSO token, OAuth
  2.0) - a scope is attached to the API key or OAuth client, not just to an OAuth grant. The OpenAPI oauth2
  scheme declares a clientCredentials flow with an EMPTY scopes map, so the scope catalog below was searched
  from the published API authorization reference rather than derived from the spec. MCP scope assignments
  come from the RFC 9728 protected-resource metadata at https://mcp.infobip.com/.well-known/oauth-protected-resource/{server}.
schemes:
- name: OAuth2
  type: oauth2
  source: openapi/infobip-platform-full-openapi.json
  flows:
  - flow: clientCredentials
    tokenUrl: https://api.infobip.com/auth/1/oauth2/token
    scopes_declared_in_spec: 0
- name: Infobip OAuth 2.1 (MCP)
  type: oauth2
  authorization_server: https://auth.infobip.com/realms/infobip
  metadata: well-known/infobip-oauth-authorization-server.json
  flows:
  - flow: authorizationCode
    authorizationUrl: https://auth.infobip.com/realms/infobip/protocol/openid-connect/auth
    tokenUrl: https://auth.infobip.com/realms/infobip/protocol/openid-connect/token
  - flow: clientCredentials
    tokenUrl: https://auth.infobip.com/realms/infobip/protocol/openid-connect/token
- name: APIKeyHeader
  type: apiKey
  in: header
  parameter: Authorization
  note: API keys carry the same scope set; scopes are chosen at key-creation time.
scope_types:
- pattern: message:send
  meaning: Send mobile-terminated messages on any channel; superset of all channel:message:send scopes
- pattern: inbound-message:read
  meaning: Read mobile-originated messages on any channel
- pattern: <product|channel>:manage
  meaning: All endpoints for one product or channel
- pattern: <product>:read
  meaning: Read-only access to that product
- pattern: <product>:<resource>:<action>
  meaning: Fine-grained action on one resource
- pattern: web:sdk / mobile-app-messaging:sdk / 2fa:sdk
  meaning: Client-side SDK access to a narrow endpoint subset
oauth_identity_scopes:
- scope: profile
  description: OpenID Connect profile claim; requested by every Infobip MCP server
- scope: offline_access
  description: Refresh-token issuance; requested by every Infobip MCP server

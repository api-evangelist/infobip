- family: DLT error codes
  groups:
  - group: null
    group_id: null
    kind: status
    code_count: 51
    codes:
    - id: 4106
      name: EC_BLOCKED_BY_DLT
      description: This error indicates that a message has been blocked by the DLT Provider due to regulatory compliance
        issues, sender registration, template registration, and so on.
    - id: 4107
      name: EC_DLT_SCRUBBING_TIMEOUT
      description: Timeout while performing DLT Scrubbing.
    - id: 4108
      name: EC_SENDER_BLOCKED_BY_DLT
      description: The error typically indicates that the sender of a message has been blocked by the DLT Provider.
        This means that the sender has been restricted from sending messages due to non-compliance with regulations,
        insufficient registration, or other factors determined by the DLT Provider.
    - id: 4109
      name: EC_TELEMARKETER_BLOCKED_BY_DLT
      description: Telemarketer blocked by DLT Scrubbing.
    - id: 4110
      name: EC_ENTITY_BLOCKED_BY_DLT
      description: The error typically indicates that the principal entity ID of a message has been blocked by the
        DLT Provider. This means that the entity has been restricted from sending messages due to non-compliance
        with regulations, insufficient registration, or other factors determined by the DLT Provider.
    - id: 4111
      name: EC_TEMPLATE_BLOCKED_BY_DLT
      description: The error typically indicates that the template or content of a message has been blocked by the
        DLT Provider. This means that the message template or content has been restricted from sending messages
        due to non-compliance with regulations, insufficient registration, or other factors determined by the DLT
        Provider.
    - id: 4112
      name: EC_ENTITY_NOT_FOUND
      description: Indicates that the requested principal entity ID could not be found or located. This means that
        the DLT Provider was unable to locate the specific PE ID being referenced. It could be due to various reasons,
        such as an incorrect identifier, a non-existent entity, or a misconfiguration.
    - id: 4113
      name: EC_ENTITY_NOT_REGISTERED
      description: No entry of entity on the platform.
    - id: 4114
      name: EC_ENTITY_INACTIVE
      description: This error code indicates that the principal entity in question is inactive or disabled. This
        could be due to various reasons, such as principal entity ID suspension, temporary deactivation, or restrictions.
        Resolving this error typically includes checking with the DLT Provider.
    - id: 4115
      name: EC_ENTITY_BLACKLISTED
      description: This error code indicates that the requested principal entity has been blocklisted. It means
        that the entity is restricted or prohibited on DLT Provider, due to issues such as violation of policies,
        non-compliance, or suspicious activity.
    - id: 4116
      name: EC_INVALID_ENTITY_ID
      description: This error code suggests that the provided Principal entity ID is in an invalid or wrong format
        or does not exist in the DLT Provider. It means that the principal entity ID is incorrect or unrecognized.
        Verifying the accuracy of the entity ID or resolving any issues related to the entity's DLT provider can
        help resolve this error.
    - id: 4117
      name: EC_ENTITY_ID_NOT_ALLOWED_FOR_TM
      description: Principal entity is not allowed for the TM.
    - id: 4118
      name: EC_TELEMARKETER_NOT_REGISTERED
      description: No entry of TMID on the platform.
    - id: 4119
      name: EC_TELEMARKETER_INACTIVE
      description: Telemarketer is inactive on the platform.
    - id: 4120
      name: EC_TELEMARKETER_BLACKLISTED
      description: Telemarketer is blocklisted on all platforms.
    - id: 4121
      name: EC_HEADER_NOT_FOUND
      description: This error code signifies that the requested header/sender ID information was not found. It means
        that the DLT Provider could not locate the required header in the given context or request. Review the request
        structure, and ensure the presence of the necessary headers.
    - id: 4122
      name: EC_HEADER_INACTIVE
      description: This error code indicates that the requested header is inactive or disabled. It means that the
        header, typically used to send messages, is currently inactive. Activating the required header or checking
        for any configuration or permission-related issues on DLT Provider can help resolve this error.
    - id: 4123
      name: EC_HEADER_BLACKLISTED
      description: This error code suggests that the requested header has been blocklisted, meaning it is restricted
        or prohibited from being used. It could be due to policy violations, non-compliance, or suspicious activity.
    - id: 4124
      name: EC_PEID_NOT_MATCHED_WITH_HEADER
      description: This error code indicates that the provided PEID (Principal Entity ID) does not match the header/sender
        ID information. It means that there is a mismatch between the specified PEID and the associated header in
        the request. Verifying the accuracy and alignment of the PEID and header on the DLT Provider can help resolve
        this error.
    - id: 4125
      name: EC_HEADER_IN_FREEPOOL
      description: Header in free pool.
    - id: 4126
      name: EC_TEMPLATE_NOT_FOUND
      description: This error code signifies that the requested template could not be found. It means that the DLT
        Provider was unable to locate the specified template, which is typically used for standardized message formats
        or content. Verifying the template's existence, correcting the identifier, or troubleshooting any issues
        related to template retrieval can help address this error.
    - id: 4127
      name: EC_TEMPLATE_INACTIVE
      description: This error code suggests that the requested template is inactive or disabled. It means that the
        template, which is typically used for predefined message structures, is currently not active on DLT Provider.
        Activating the required template or addressing any configuration or permission-related issues with DLT Provider
        can help resolve this error.
    - id: 4128
      name: EC_TEMPLATE_BLACKLISTED
      description: This error code indicates that the requested template has been blocklisted, meaning it is restricted
        or prohibited from being used. It could be due to policy violations, non-compliance, or suspicious activity.
    - id: 4129
      name: EC_TEMPLATE_NOT_MATCHED
      description: This error code suggests that the requested template does not match the provided content or message.
        It means that there is a mismatch between the specified template and the actual content being sent. Ensuring
        the alignment between the registered template and the actual content being sent can help resolve this error.
    - id: 4130
      name: EC_HEADER_NOT_REGISTERED_FOR_TEMPLATE
      description: This error code signifies that the specified header is not registered or associated with the
        requested template. It means that the header being used does not align with the template requirements or
        associations. Verifying the registration and link between the header and template can help address this
        error.
    - id: 4131
      name: EC_TEMPLATE_VARIABLE_EXCEEDED_MAX_LENGTH
      description: This error code indicates that a variable within the template exceeds the maximum allowed length.
        It means that variables used within the template exceed the defined character limit. Adjusting the character
        length can help resolve this error.
    - id: 4132
      name: EC_ERROR_IDENTIFYING_TEMPLATE
      description: Error in identifying the template.
    - id: 4133
      name: EC_INVALID_TEMPLATE_ID
      description: This error code suggests that the provided template ID is invalid or does not exist in the system.
        It means that the template ID/content ID used to reference a specific template is incorrect or unrecognized.
        Verifying the accuracy of the template ID or troubleshooting any issues related to the template's existence
        can help address this error.
    - id: 4134
      name: EC_TEMPLATE_NOT_REGISTERED_TO_ENTITY
      description: This error code signifies that the requested template is not registered or associated with the
        specified principal entity ID. It means the template being used does not link to the intended principal
        entity. Verifying the registration and association between the template and principal entity ID can help
        resolve this error.
    - id: 4135
      name: EC_PROMOTIONAL_TEMPLATE_USED_ON_OTHERS_HEADER
      description: Promotional template used on other/transaction header.
    - id: 4136
      name: EC_INVALID_TEMPLATE_TYPE
      description: Invalid template type.
    - id: 4137
      name: EC_PREFERENCE_NOT_MATCHED
      description: This error code indicates that the requested preference does not match the specified criteria
        on the end user number. It means that the preference being used does not align with the end user number.
    - id: 4138
      name: EC_INVALID_PROMO_TIME
      description: This error code suggests that the provided promotional time is invalid or outside the allowed
        range (9 PM to 10 AM). It means that the specified promotional time period does not adhere to the defined
        constraints or rules.
    - id: 4139
      name: EC_SE_CATEGORY_BLOCK
      description: This error code indicates that the requested category of service entity (SE) has been blocked.
        It means that the particular category or type of service entity is restricted or prohibited from being used.
        Resolving this error typically includes checking the category of service entity or using a DND consent on
        a specific number.
    - id: 4140
      name: EC_CONSENT_FAILED
      description: General error code for consent.
    - id: 4141
      name: EC_SCRUBBING_FAILED
      description: General error code in case of any exceptions.
    - id: 4142
      name: EC_TLV_PEID_NOT_FOUND
      description: This error code suggests that the requested Principal Entity ID (PEID) within the TLV structure
        was not found. It means that the system or service could not locate the specified PEID within the TLV data.
        Verifying the correct use and presence of the PEID within the TLV structure in the SMPP request can help
        resolve this error.
    - id: 4143
      name: EC_TLV_TMPID_NOT_FOUND
      description: This error code signifies that the requested Template ID within the TLV structure was not found.
        It means that the system or service was unable to locate the specified template ID within the TLV data.
        Verifying the correct usage and presence of the template ID within the TLV structure in the SMPP request
        can help address this error.
    - id: 4144
      name: EC_CONTENT_MULTIPART_INCOMPLETE_BY_DLT
      description: Undelivered/expired. If the DLT has not received long SMS parts or if any part is missing, the
        DLT shows this code.
    - id: 4146
      name: EC_HEADER_SUSPENDED_DUE_TO_VALIDITY
      description: This error signifies that the header has been suspended due to validity issues concerning DLT
        compliance. To resolve this, review and ensure that the header information complies with DLT regulations.
    - id: 4147
      name: EC_HEADER_SUSPENDED_DUE_TO_USAGE
      description: This error occurs when the header is suspended due to excessive usage that violates DLT regulations.
        Evaluate your SMS sending practices, consider reducing the volume of messages sent, and adhere to DLT guidelines.
    - id: 4148
      name: EC_HEADER_SUSPENDED_DUE_TO_CUSTOMER
      description: This error suggests that the header has been suspended due to issues related to the customer's
        DLT account. Contact your DLT service provider or Support to address and resolve customer-specific DLT compliance
        concerns.
    - id: 4149
      name: EC_TEMPLATE_SUSPENDED_DUE_TO_VALIDITY
      description: This error indicates that the template has been suspended due to validity problems concerning
        DLT compliance. To rectify this, review and correct the template content to ensure it aligns with DLT regulations
        and standards.
    - id: 4150
      name: EC_TEMPLATE_SUSPENDED_DUE_TO_USAGE
      description: This error arises when the template is suspended due to excessive usage that violates DLT regulations.
        Optimize your SMS templates or reduce the frequency of template usage to comply with DLT guidelines.
    - id: 4151
      name: EC_TEMPLATE_SUSPENDED_DUE_TO_CUSTOMER
      description: This error implies that the template has been suspended due to issues related to the customer's
        DLT compliance status. Contact your DLT service provider or Support to address and resolve customer-specific
        DLT compliance matters.
    - id: 4153
      name: EC_CTA_NOT_WHITELISTED
      description: This error indicates that the URL in your SMS template has not been safelisted on the DLT platform,
        a requirement for SMS delivery in accordance with TRAI regulations.
    - id: 4154
      name: EC_PE_TM_HASH_NOT_RECEIVED
      description: This error indicates that the PE-TM hash was not received or an empty value was provided in the
        request.
    - id: 4155
      name: EC_PE_TM_HASH_NOT_REGISTERED
      description: This error indicates that the submitted PE-TM hash does not match any registered hash for the
        specified PE.
    - id: 4156
      name: EC_PE_TM_HASH_INACTIVE
      description: This error indicates that the status of the PE-TM hash is invalid because one of the telemarketers
